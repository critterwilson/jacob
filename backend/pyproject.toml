[project]
name = "jacob-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "google-cloud-vision>=3.7",
    "pydantic-settings>=2.0",
    "jinja2>=3.1.6",
    "sendgrid>=6.11",
    "sentry-sdk[fastapi]>=2.58.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32",
    # T55 — DNS TXT verification for vanity-domain claims.
    "dnspython>=2.6",
    # T53 — SSRF-guarded HTTP fetch for the unfurl service.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "black>=24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "emulator: tests that require a running Firestore emulator (FIRESTORE_EMULATOR_HOST). Skipped by default in `pytest`; run with `pytest -m emulator` after `firebase emulators:exec --only firestore ...`.",
]
# Default invocation skips emulator tests so `pytest` works locally
# without the emulator. The emulator-only CI step overrides with `-m emulator`.
addopts = "-m 'not emulator'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
