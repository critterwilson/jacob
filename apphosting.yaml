# Firebase App Hosting backend configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# This file is read by App Hosting on every build/rollout. The backend
# resource itself (region, GitHub repo connection, live branch) is
# created once with `firebase apphosting:backends:create`; see
# README.md for the one-time setup steps.
#
# rootDirectory is set to "/" (repo root) on the backend resource so that
# App Hosting can find pnpm-lock.yaml, which lives at the workspace root.
# GOOGLE_BUILDABLE tells the buildpacks where the Next.js app lives.

runConfig:
  # Phase 1 traffic is small; cold starts on cheap min-instances=0 are
  # acceptable. Bump these once we have real users.
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Public env vars and secret references go here as later tasks need them
# (e.g. NEXT_PUBLIC_FIREBASE_* in T04, Sentry DSN in T15). Keep the file
# committed; secrets are referenced by name, not by value.
#
# NEXT_PUBLIC_* vars must be available at BUILD time (Next.js inlines them
# into the JS bundle). Setting them only in the console gives runtime-only
# access and results in undefined values in the browser bundle.
env:
  - variable: GOOGLE_BUILDABLE
    value: frontend
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD_En5-SYxe7uKxINvqWwCZP-eLPvv8Kgo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: jacob-staging-494515.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: jacob-staging-494515
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: jacob-staging-494515.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "732806466572"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:732806466572:web:b116cc97300415e0203229
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_URL
    value: https://jacob-backend-7fk543coqq-uc.a.run.app
    availability:
      - BUILD
      - RUNTIME
