name: Deploy

on:
  push:
    branches: [main]        # → staging (automatic)
  workflow_dispatch:        # → production (manual button in GitHub Actions UI)
    inputs:
      environment:
        description: "Deploy to production"
        required: true
        default: production
        type: choice
        options:
          - production

jobs:
  # Compute the target environment once; downstream jobs read the outputs.
  setup:
    name: "Determine target"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      firebase-alias: ${{ steps.set.outputs.firebase-alias }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=staging"    >> "$GITHUB_OUTPUT"
            echo "firebase-alias=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "firebase-alias=production" >> "$GITHUB_OUTPUT"
          fi

  # ── Backend: build image → Artifact Registry → Cloud Run ──────────────────
  deploy-backend:
    name: "Deploy backend → Cloud Run (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}"
          docker build -t "$IMAGE" -f backend/Dockerfile backend/
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image
        run: docker push "$IMAGE"

      - name: Resolve CORS allowlist
        id: cors
        # Staging origins are non-secret (public hosted.app URL + custom
        # domain + localhost for dev tooling) and are baked in here so the
        # staging deploy can never silently lose its allowlist again — see
        # docs/runbooks/backend-deploy.md. Production must come from the
        # CORS_ALLOWED_ORIGINS GitHub Environment secret; an empty value
        # makes the backend fail closed (PR #141 / H4).
        run: |
          if [[ "${{ needs.setup.outputs.target }}" == "staging" ]]; then
            echo 'origins=https://jacob-frontend--jacob-staging-494515.us-central1.hosted.app,https://jacob.app,http://localhost:3000' >> "$GITHUB_OUTPUT"
          else
            echo 'origins=${{ secrets.CORS_ALLOWED_ORIGINS }}' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloud Run
        # `^@^` switches gcloud's --set-env-vars key delimiter from ',' to
        # '@' so commas inside the CORS allowlist value are preserved
        # instead of being parsed as additional env-var keys.
        run: |
          gcloud run deploy jacob-backend \
            --image "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "^@^ENVIRONMENT=${{ needs.setup.outputs.target }}@CORS_ALLOWED_ORIGINS=${{ steps.cors.outputs.origins }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"

  # ── Functions + Firestore rules: firebase deploy ──────────────────────────
  # Deploys Cloud Functions (TypeScript) and Firestore security rules + indexes.
  deploy-firebase:
    name: "Deploy Firebase (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Cloud Functions
        run: pnpm --filter jacob-functions build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions and Firestore rules + indexes
        run: >
          firebase deploy
          --only functions,firestore
          --force
          --project ${{ needs.setup.outputs.firebase-alias }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
