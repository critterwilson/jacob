name: Deploy

on:
  push:
    branches: [main]        # → staging (automatic)
  workflow_dispatch:        # → production (manual button in GitHub Actions UI)
    inputs:
      environment:
        description: "Deploy to production"
        required: true
        default: production
        type: choice
        options:
          - production

jobs:
  # Compute the target environment once; downstream jobs read the outputs.
  setup:
    name: "Determine target"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      firebase-alias: ${{ steps.set.outputs.firebase-alias }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=staging"    >> "$GITHUB_OUTPUT"
            echo "firebase-alias=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "firebase-alias=production" >> "$GITHUB_OUTPUT"
          fi

  # ── Backend: build image → Artifact Registry → Cloud Run ──────────────────
  deploy-backend:
    name: "Deploy backend → Cloud Run (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}"
          docker build -t "$IMAGE" -f backend/Dockerfile backend/
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy jacob-backend \
            --image "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --project "${{ secrets.GCP_PROJECT_ID }}"

  # ── Functions + Firestore rules: firebase deploy ──────────────────────────
  # The frontend deploys via Firebase App Hosting, which builds and rolls
  # out automatically on pushes to its configured "live" branch (set up
  # once with `firebase apphosting:backends:create` — see README.md). CI
  # only deploys the resources that App Hosting doesn't manage.
  deploy-firebase:
    name: "Deploy Firebase (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Cloud Functions
        run: pnpm --filter jacob-functions build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions and Firestore rules + indexes
        run: >
          firebase deploy
          --only functions,firestore
          --project ${{ needs.setup.outputs.firebase-alias }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
