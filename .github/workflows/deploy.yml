name: Deploy

on:
  push:
    branches: [main]        # → staging (automatic)
  workflow_dispatch:        # → production (manual button in GitHub Actions UI)
    inputs:
      environment:
        description: "Deploy to production"
        required: true
        default: production
        type: choice
        options:
          - production

jobs:
  # Compute the target environment once; downstream jobs read the outputs.
  setup:
    name: "Determine target"
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set.outputs.target }}
      firebase-alias: ${{ steps.set.outputs.firebase-alias }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "target=staging"    >> "$GITHUB_OUTPUT"
            echo "firebase-alias=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "firebase-alias=production" >> "$GITHUB_OUTPUT"
          fi

  # ── Backend: build image → Artifact Registry → Cloud Run ──────────────────
  deploy-backend:
    name: "Deploy backend → Cloud Run (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}"
          docker build -t "$IMAGE" -f backend/Dockerfile backend/
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy jacob-backend \
            --image "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jacob-images/jacob-backend:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --project "${{ secrets.GCP_PROJECT_ID }}"

  # ── Frontend + Functions + Firestore rules: single firebase deploy ─────────
  deploy-firebase:
    name: "Deploy Firebase (${{ needs.setup.outputs.target }})"
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (static export → frontend/out/)
        run: pnpm --filter jacob-frontend build

      - name: Build Cloud Functions
        run: pnpm --filter jacob-functions build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting, functions, and Firestore rules + indexes
        run: >
          firebase deploy
          --only hosting,functions,firestore
          --project ${{ needs.setup.outputs.firebase-alias }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
