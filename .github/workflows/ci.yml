name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-lint:
    name: "Frontend — lint & type-check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter jacob-frontend lint
      - run: pnpm --filter jacob-frontend type-check

  frontend-test:
    name: "Frontend — vitest"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter jacob-frontend test

  frontend-e2e:
    name: "Frontend — Playwright E2E"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The frontend runs LOCALLY (Next.js prod build on :3000) wired to a
    # Firebase Auth **emulator** on :9099, so the suite no longer hammers
    # real-Firebase signin/signup endpoints — those rate-limited every PR
    # with TOO_MANY_ATTEMPTS_TRY_LATER. Backend calls still hit staging
    # Cloud Run; staging accepts emulator-issued tokens because deploy.yml
    # sets `JACOB_ALLOW_EMULATOR_TOKENS=1` on staging only (forbidden in
    # prod by `Settings._block_emulator_tokens_in_production`).
    #
    # Runs on every PR (not just frontend/** changes) because CORS / API
    # regressions land via backend PRs too — the very class of bug this
    # suite exists to catch. Required check; failures should not be hidden
    # behind continue-on-error.
    timeout-minutes: 25
    env:
      JACOB_E2E_FIREBASE_PROJECT_ID: "jacob-staging-494515"
      PLAYWRIGHT_API_URL: "https://jacob-backend-7fk543coqq-uc.a.run.app"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install Playwright Chromium
        run: pnpm --filter jacob-frontend exec playwright install --with-deps chromium

      - name: Look up shared E2E user UID on staging
        # One-shot real-Firebase admin call (not subject to the signin/signup
        # rate limits). Result is exported into $GITHUB_ENV so subsequent
        # steps can seed the same UID into the emulator.
        env:
          JACOB_E2E_USER_EMAIL: ${{ secrets.JACOB_E2E_USER_EMAIL }}
          JACOB_E2E_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.JACOB_E2E_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$JACOB_E2E_USER_EMAIL" || -z "$JACOB_E2E_FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::warning::JACOB_E2E_USER_EMAIL or JACOB_E2E_FIREBASE_SERVICE_ACCOUNT not set — shared-account tests will skip."
            exit 0
          fi
          node frontend/e2e/scripts/fetch-staging-uid.mjs >> "$GITHUB_ENV"

      - name: Build frontend (with emulator config baked in)
        # NEXT_PUBLIC_* env vars are inlined at build time, so they MUST be
        # set here, not just at runtime. The build then knows to call the
        # local Auth emulator on the client and the staging backend for /api.
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "jacob-staging-494515"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "jacob-staging-494515.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_API_KEY: "fake-api-key-for-emulator"
          NEXT_PUBLIC_FIREBASE_APP_ID: "fake-app-id-for-emulator"
          NEXT_PUBLIC_API_URL: "https://jacob-backend-7fk543coqq-uc.a.run.app"
        run: pnpm --filter jacob-frontend build

      - name: Boot Auth emulator + frontend, run Playwright
        env:
          # Tests + admin SDK both detect emulator mode via this var. The
          # emulator's host:port matches firebase.json's auth.port.
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
          JACOB_E2E_USER_EMAIL: ${{ secrets.JACOB_E2E_USER_EMAIL }}
          JACOB_E2E_USER_PASSWORD: ${{ secrets.JACOB_E2E_USER_PASSWORD }}
          # JACOB_E2E_USER_UID is exported into $GITHUB_ENV by the lookup
          # step above and propagated into this step's env automatically.
        run: |
          firebase emulators:exec \
            --only auth \
            --project "$JACOB_E2E_FIREBASE_PROJECT_ID" \
            "bash frontend/e2e/scripts/run-with-emulator.sh"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Upload frontend server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-server-log
          path: frontend-server.log
          retention-days: 7

  backend-lint:
    name: "Backend — ruff, black, mypy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: black --check .
        working-directory: backend
      - run: mypy app/
        working-directory: backend
      - run: python scripts/lint_writes_have_not_banned.py
        working-directory: backend

  backend-test:
    name: "Backend — pytest"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
        working-directory: backend
      # H8: enforce a coverage floor 5pp below the current ~83%, so this
      # gate doesn't immediately go red but does block a meaningful
      # regression. Bump as coverage ratchets up.
      - run: pytest --cov=app --cov-report=term --cov-fail-under=78
        working-directory: backend

  backend-emulator-test:
    name: "Backend — pytest against Firestore emulator (H8)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
        working-directory: backend
      - run: npm install -g firebase-tools
      # H8: emulator-marked backend tests catch real query-shape issues
      # that mock-based unit tests miss. The default `pytest` step skips
      # them via `addopts = -m 'not emulator'`; this step runs ONLY them
      # with the emulator booted. `--override-ini=addopts=` clears the
      # default skip so `-m emulator` actually selects the marked tests.
      - name: Run backend tests against Firestore emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GOOGLE_CLOUD_PROJECT: demo-jacob
        run: >
          firebase emulators:exec
          --only firestore
          --project demo-jacob
          "pytest -m emulator -v --override-ini=addopts="
        working-directory: backend

  functions-build:
    name: "Functions — tsc & eslint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter jacob-functions build
      - run: pnpm --filter jacob-functions lint
      - run: pnpm --filter jacob-functions test

  rules-test:
    name: "Firestore rules — vitest + emulator"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: npm install -g firebase-tools
      - name: Run rules tests against Firestore + Database emulators
        run: >
          firebase emulators:exec
          --only firestore,database
          --project demo-jacob
          "pnpm --filter jacob-firestore test"
      - name: Run frontend integration tests against the emulator (M9)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: >
          firebase emulators:exec
          --only firestore
          --project demo-jacob
          "pnpm --filter jacob-frontend test:integration"
