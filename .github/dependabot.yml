version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # L11: forward-looking entry for the Typesense image pinned in
  # infra/typesense.tf. Dependabot's docker ecosystem scans Dockerfiles,
  # not Terraform, so this is a no-op until /infra grows a Dockerfile —
  # the operational mechanism today is the digest-rotation runbook at
  # docs/runbooks/typesense-image-pin.md.
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - critterwilson

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
